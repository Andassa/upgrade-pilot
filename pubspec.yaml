name: upgrade_pilot
description: >-
  Rehearse a Flutter upgrade in an isolated sandbox and get a verified plan:
  the exact SDK, pub and Android/iOS toolchain changes, proven by a real build.
version: 1.0.0
repository: https://github.com/Andassa/upgrade-pilot
issue_tracker: https://github.com/Andassa/upgrade-pilot/issues
topics:
  - flutter
  - cli
  - upgrade
  - gradle
  - migration

environment:
  sdk: ^3.6.0

executables:
  upgrade-pilot: upgrade_pilot
dependencies:
  args: ^2.7.0
  crypto: ^3.0.7
  http: ^1.6.0
  meta: ^1.19.0
  path: ^1.9.1
  pub_semver: ^2.2.1
  yaml: ^3.1.4
  yaml_edit: ^2.2.4
dev_dependencies:
  coverage: ^1.16.0
  mocktail: ^1.0.5
  test: ^1.33.0
  very_good_analysis: ^10.3.0
