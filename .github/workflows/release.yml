name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  binaries:
    name: binary (${{ matrix.target }})
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
            ext: ''
          - os: macos-latest
            target: macos-arm64
            ext: ''
          - os: macos-13
            target: macos-x64
            ext: ''
          - os: windows-latest
            target: windows-x64
            ext: .exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - name: Compile
        shell: bash
        run: |
          mkdir -p dist
          dart compile exe bin/upgrade_pilot.dart -o dist/upgrade-pilot-${{ matrix.target }}${{ matrix.ext }}
          dist/upgrade-pilot-${{ matrix.target }}${{ matrix.ext }} --version
      - name: Checksum
        shell: bash
        run: |
          cd dist
          if command -v sha256sum >/dev/null; then sha256sum * > upgrade-pilot-${{ matrix.target }}.sha256
          else shasum -a 256 * > upgrade-pilot-${{ matrix.target }}.sha256; fi
      - uses: actions/upload-artifact@v4
        with:
          name: upgrade-pilot-${{ matrix.target }}
          path: dist/*

  publish-check:
    name: pub.dev dry run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - run: dart run tool/publish_check.dart

  release:
    name: GitHub release
    needs: [binaries, publish-check]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: SBOM (CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: dist/upgrade-pilot.cdx.json
          upload-artifact: false
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag

  pub-dev:
    name: publish to pub.dev
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
